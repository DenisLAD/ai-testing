spring:
  application:
    name: ai-testing

  # База данных H2
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Spring AI — OpenAI-совместимый API (в k8s задаётся через env / Secret)
  ai:
    model:
      chat: openai
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:http://localhost:1234}
      # Пустой ключ отключает автоконфиг Spring AI; для LM Studio/RouterAI нужен непустой placeholder
      api-key: ${SPRING_AI_OPENAI_API_KEY:local-dev-key}
      chat:
        enabled: true
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:local-model}
          temperature: ${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE:0.7}

# Server
server:
  port: 8080

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Логирование
logging:
  level:
    root: INFO
    ru.sbrf.uddk.ai.testing: DEBUG
    org.springframework.ai: DEBUG
    org.openqa.selenium: WARN

# Скриншоты и Selenium
app:
  screenshots:
    dir: ${APP_SCREENSHOTS_DIR:/tmp/screenshots}
    format: png
    max-size-kb: 500
  selenium:
    webdriver-manager-enabled: ${APP_SELENIUM_WEBDRIVER_MANAGER_ENABLED:true}
    chrome-binary: ${APP_SELENIUM_CHROME_BINARY:}
    chromedriver-path: ${APP_SELENIUM_CHROMEDRIVER_PATH:}
    window-width: ${APP_SELENIUM_WINDOW_WIDTH:1920}
    window-height: ${APP_SELENIUM_WINDOW_HEIGHT:1080}
